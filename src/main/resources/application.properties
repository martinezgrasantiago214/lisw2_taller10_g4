spring.application.name=question-bank-saberpro

# In-memory H2 database
spring.datasource.url=jdbc:h2:mem:questionbank;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the schema on start-up and drops it on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:questionbank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Loads sample data on start-up (disabled in tests)
app.seed-data=true
